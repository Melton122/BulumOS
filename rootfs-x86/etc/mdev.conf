# BulumOS device permissions (Phase 8 + Phase 9.4)
#
# Phase 8 security model (graphics + input are root-group restricted):
#   fb devices     root:video  660   (/dev/fb0)
#   DRM devices    root:video  660   (/dev/dri/card0, renderD128)
#   input devices  root:input  660   (/dev/input/event*)
#
# Phase 9.4 USB (added):
#   USB mass-storage  root:disk (gid 6) 660   (/dev/sd*, sg*)
#   USB serial        root:dialout (gid 5) 660 (/dev/ttyUSB*, ttyACM*)
#   Generic block     root:disk           660   (/dev/hd*, mmcblk*, nvme*)
#   Auto-mount handler runs for sd* partitions.
fb[0-9]        0:44 660
card[0-9]      0:44 660
renderD[0-9]+  0:44 660
event[0-9]+    0:45 660

# USB / block storage
sd[a-z]        0:6 660
sd[a-z][0-9]+  0:6 660 */sbin/mdev-automount.sh
hd[a-z]        0:6 660
hd[a-z][0-9]+  0:6 660
sg[0-9]+       0:6 660
mmcblk[0-9]+   0:6 660
mmcblk[0-9]+p[0-9]+ 0:6 660
nvme[0-9]+n[0-9]+    0:6 660
nvme[0-9]+n[0-9]+p[0-9]+ 0:6 660

# USB serial
ttyUSB[0-9]+   0:5 660
ttyACM[0-9]+   0:5 660
