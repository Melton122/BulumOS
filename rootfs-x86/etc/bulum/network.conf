# BulumOS network configuration (/etc/bulum/network.conf)
# One block per interface, started by an interface= line.
# bnet apply (invoked by the network service) applies these settings.

interface=eth0
method=dhcp

# example: static configuration
# interface=eth1
# method=static
# address=192.168.1.50/24
# gateway=192.168.1.1
# dns=1.1.1.1
# dns=8.8.8.8