# bulum repository configuration
# format: name url arch keyname [flags]
#   url   http://host:port            (add "https://" + insecure flag for self-signed)
#   arch  arm64 | your-arch | all
#   key   key basename from /etc/bulum/keys/ (dash = unsigned, not recommended)
#   flags insecure  skip TLS certificate checks (https only)
#   flags disabled  skip this repository during update
# The OS image ships with the main (test) and official repositories enabled.
# Both indices carry packages for every architecture, so the arch field here
# is informational only; per-package architecture filtering happens at install.
main http://10.0.2.2:17474 all /etc/bulum/keys/main.pub
official http://10.0.2.2:17475 all /etc/bulum/keys/official.pub