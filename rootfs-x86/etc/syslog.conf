# BulumOS syslogd configuration (busybox syslogd reads /etc/syslog.conf
# when CONFIG_FEATURE_SYSLOGD_CFG is enabled).
#
# Format: <facility.priority> <destination>
#
#   Kernel messages  -> /var/log/kern.log
#   Everything else  -> /var/log/messages
kern.*      /var/log/kern.log
*.notice    /var/log/messages
*.warn      /var/log/messages
*.err       /var/log/messages
