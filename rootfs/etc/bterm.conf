# bterm configuration (BulumOS native terminal)
#
# User override: ~/.config/bterm/config  (loaded after this file)

# scrollback ring capacity in lines (100..50000)
scrollback=10000

# scrollback viewer colors: default | light | dark
theme=default

# cursor blink in the scrollback viewer: yes | no
cursor-blink=no

# print a small startup banner: yes | no (default no - the shell owns the screen)
banner=no
