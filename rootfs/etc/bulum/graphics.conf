# BulumOS graphics configuration (Phase 8)
#
# Supported settings (values the implementation actually uses):
#   backend=auto|framebuffer|drm
#       auto         detect framebuffer or DRM (Phase 8 primary: framebuffer)
#       framebuffer  force the /dev/fb0 framebuffer backend
#       drm          NOT implemented in Phase 8 (detection only);
#                    direct DRM/KMS is the next backend
#   resolution=auto
#       auto         use the native framebuffer resolution (only value
#                    supported in Phase 8)
#   input=auto
#       auto         detect keyboards/mice on /dev/input/event* (only
#                    value supported in Phase 8)
backend=auto
resolution=auto
input=auto